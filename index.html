    <!-- JS Logic -->
    <script>
        // ==========================================
        // 1. CONFIG & STATE
        // ==========================================
        const SUPABASE_URL = 'https://frswsrizweqrfigepprj.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_HxQKMiDaIhgXxlGJITBZ4g_2MrT08ux'; 
        
        const dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let appState = {
            user: null, 
            school: null, 
            currentPage: 'dashboard'
        };

        // ==========================================
        // 2. UTILITIES
        // ==========================================
        const showLoader = () => {
            const el = document.getElementById('globalLoader');
            el.classList.remove('hidden');
            el.classList.add('flex');
        };

        const hideLoader = () => {
            const el = document.getElementById('globalLoader');
            el.classList.remove('flex');
            el.classList.add('hidden');
        };
        
        const showToast = (message, type = 'success') => {
            const Toast = Swal.mixin({
                toast: true,
                position: "top-end",
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true,
                didOpen: (toast) => {
                    toast.onmouseenter = Swal.stopTimer;
                    toast.onmouseleave = Swal.resumeTimer;
                }
            });
            let swalIcon = type === 'danger' ? 'error' : (type === 'warning' ? 'warning' : 'success');
            Toast.fire({ icon: swalIcon, title: message });
        };

        const formatCurrency = (num) => new Intl.NumberFormat('th-TH', { style: 'decimal', minimumFractionDigits: 2 }).format(num || 0);

        // ฟังก์ชันแปลงตัวเลขเป็นตัวอักษรภาษาไทย (บาทถ้วน)
        function ThaiBaht(NumberAmount) {
            let TxtNumArr = new Array("ศูนย์", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า", "สิบ");
            let TxtDigitArr = new Array("", "สิบ", "ร้อย", "พัน", "หมื่น", "แสน", "ล้าน");
            let BahtText = "";
            if (isNaN(NumberAmount)) return "ข้อมูลไม่ถูกต้อง";
            if ((NumberAmount - 0) === 0) return "ศูนย์บาทถ้วน";
            
            NumberAmount = Math.round(NumberAmount * 100) / 100;
            let NumberStr = NumberAmount.toString();
            let NumberStrArr = NumberStr.split('.');
            let integerPart = NumberStrArr[0];
            let decimalPart = NumberStrArr.length > 1 ? NumberStrArr[1] : "";
            
            let intText = "";
            let intLength = integerPart.length;
            for (let i = 0; i < intLength; i++) {
                let n = parseInt(integerPart.charAt(i));
                if (n !== 0) {
                    if (i === (intLength - 1) && n === 1 && intLength > 1) {
                        intText += "เอ็ด";
                    } else if (i === (intLength - 2) && n === 2) {
                        intText += "ยี่";
                    } else if (i === (intLength - 2) && n === 1) {
                        intText += "";
                    } else {
                        intText += TxtNumArr[n];
                    }
                    intText += TxtDigitArr[intLength - i - 1];
                }
            }
            BahtText += intText + "บาท";
            
            if (decimalPart === "" || decimalPart === "00" || decimalPart === "0") {
                BahtText += "ถ้วน";
            } else {
                if (decimalPart.length === 1) decimalPart += "0";
                let decText = "";
                let decLength = decimalPart.length;
                for (let i = 0; i < decLength; i++) {
                    let n = parseInt(decimalPart.charAt(i));
                    if (n !== 0) {
                        if (i === (decLength - 1) && n === 1 && decLength > 1 && parseInt(decimalPart.charAt(0)) !== 0) {
                            decText += "เอ็ด";
                        } else if (i === (decLength - 2) && n === 2) {
                            decText += "ยี่";
                        } else if (i === (decLength - 2) && n === 1) {
                            decText += "";
                        } else {
                            decText += TxtNumArr[n];
                        }
                        decText += TxtDigitArr[decLength - i - 1];
                    }
                }
                BahtText += decText + "สตางค์";
            }
            return `(${BahtText})`;
        }

        // ==========================================
        // 3. AUTHENTICATION & INITIALIZATION
        // ==========================================
        async function initApp() {
            lucide.createIcons();
            const savedUser = localStorage.getItem('prterm_user');
            if (savedUser) {
                appState.user = JSON.parse(savedUser);
                showMainApp();
            } else {
                await loadLandingPageStats();
                document.getElementById('landingPage').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        }

        async function loadLandingPageStats() {
            try {
                // 1. ดึงข้อมูลโรงเรียน และจัดการโลโก้
                const { data: school } = await dbClient.from('school_settings').select('*').limit(1).maybeSingle();
                if(school) {
                    appState.school = school;
                    document.getElementById('lp-schoolName').innerText = school.school_name;
                    document.getElementById('lp-termInfo').innerText = `ภาคเรียนที่ ${school.term} ปีการศึกษา ${school.academic_year}`;
                    
                    // เปลี่ยนจากไอคอนหมวกรับปริญญา เป็นโลโก้โรงเรียน (ถ้ามีการอัปโหลดไว้)
                    if (school.school_logo) {
                        const logoWrapper = document.getElementById('lp-logo-wrapper');
                        const defaultIcon = document.getElementById('lp-default-icon');
                        const logoImg = document.getElementById('lp-school-logo-img');
                        
                        logoImg.src = school.school_logo;
                        logoImg.classList.remove('hidden');
                        defaultIcon.classList.add('hidden');
                        
                        // เอากรอบพื้นหลังสีน้ำเงินออก ให้เห็นโลโก้เต็มๆ สวยๆ
                        logoWrapper.classList.remove('bg-primary', 'p-4', 'shadow-md');
                        logoWrapper.classList.add('bg-transparent');
                    }
                }
                
               // 2. ดึงข้อมูลสถิตินักเรียนและการจ่ายเงิน เพื่อมาคำนวณแบบหน้า Dashboard
                const [{ data: students }, { data: fees }, { data: payments }] = await Promise.all([
                    dbClient.from('students').select('id, room_type').limit(5000),
                    dbClient.from('fee_items').select('id, room_type').limit(100),
                    dbClient.from('payments').select('student_id').eq('is_paid', true).limit(10000)
                ]);

                const totalStu = students ? students.length : 0;
                let fullyPaid = 0, partialPaid = 0, unpaid = 0;

                const normalFeeCount = fees ? fees.filter(f => f.room_type === 'ห้องเรียนปกติ' || !f.room_type).length : 0;
                const specialFeeCount = fees ? fees.filter(f => f.room_type === 'ห้องเรียนพิเศษ').length : 0;

                const payCounts = {};
                if (payments) {
                    payments.forEach(p => { payCounts[p.student_id] = (payCounts[p.student_id] || 0) + 1; });
                }

                if (students) {
                    students.forEach(stu => {
                        const isSpecial = (stu.room_type && stu.room_type.includes('พิเศษ'));
                        const targetFees = isSpecial ? specialFeeCount : normalFeeCount;
                        const paidCount = payCounts[stu.id] || 0;
                        
                        if (targetFees === 0 || paidCount === 0) unpaid++;
                        else if (paidCount < targetFees) partialPaid++;
                        else fullyPaid++;
                    });
                }

                // นำตัวเลขไปแสดงในกล่อง
                document.getElementById('lp-totalStudent').innerText = totalStu;
                document.getElementById('lp-paidStudent').innerText = fullyPaid;
                document.getElementById('lp-partialStudent').innerText = partialPaid;
                document.getElementById('lp-unpaidStudent').innerText = unpaid;

            } catch (error) { console.error('Error loading stats', error); }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            if(!username) return showToast('กรุณากรอกรหัส', 'warning');
            showLoader();
            try {
                let user = null;

                const { data: studentData } = await dbClient.from('students').select('*').eq('username', username).maybeSingle();
                if (studentData) {
                    user = studentData;
                } else {
                    const { data: teacherData } = await dbClient.from('teachers').select('*').eq('username', username).maybeSingle();
                    if (teacherData) {
                        user = teacherData;
                    }
                }
                
                if (!user) {
                    showToast('ไม่พบข้อมูลผู้ใช้งาน', 'danger');
                } else {
                    appState.user = user;
                    localStorage.setItem('prterm_user', JSON.stringify(user));
                    showToast(`ยินดีต้อนรับ ${user.firstname}`);
                    
                    const { data: school } = await dbClient.from('school_settings').select('*').limit(1).maybeSingle();
                    if(school) appState.school = school;

                    showMainApp();
                }
            } catch (error) { showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'danger'); }
            hideLoader();
        }

        function confirmLogoutPrompt() {
            Swal.fire({
                title: 'ออกจากระบบ?',
                text: "คุณต้องการออกจากระบบใช่หรือไม่?",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#475569',
                confirmButtonText: 'ออกจากระบบ',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem('prterm_user');
                    appState.user = null;
                    document.getElementById('mainApp').classList.add('hidden');
                    document.getElementById('landingPage').classList.remove('hidden');
                    loadLandingPageStats();
                    document.getElementById('loginForm').reset();
                    showToast('ออกจากระบบเรียบร้อย');
                }
            });
        }

        // ==========================================
        // 4. ROUTING & UI RENDER
        // ==========================================
        function showMainApp() {
            document.getElementById('landingPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            
            const initial = appState.user.firstname.charAt(0);

            document.getElementById('mobileUserAvatar').innerText = initial;
            document.getElementById('sidebarUserName').innerText = `${appState.user.prefix || ''}${appState.user.firstname} ${appState.user.lastname}`;
            
            const roleLabels = { admin: 'ผู้ดูแลระบบ', director: 'ผู้อำนวยการ', teacher: 'ครูที่ปรึกษา', student: 'นักเรียน' };
            document.getElementById('sidebarUserRole').innerText = roleLabels[appState.user.role] || '';

            renderMenus();
            navigate(appState.user.role === 'student' ? 'my-fees' : 'dashboard');
        }

        const menuConfig = [
            { id: 'dashboard', icon: 'layout-dashboard', label: 'ภาพรวม', roles: ['admin', 'director'] },
            { id: 'advisory', icon: 'users', label: 'นักเรียนที่ปรึกษา', roles: ['teacher'] },
            { id: 'my-fees', icon: 'file-text', label: 'รายการชำระเงิน', roles: ['student'] },
            { id: 'school-settings', icon: 'settings', label: 'ตั้งค่าโรงเรียน', roles: ['admin'], isAdminOnly: true },
            { id: 'students-manage', icon: 'graduation-cap', label: 'นักเรียน', roles: ['admin'], isAdminOnly: true },
            { id: 'teachers-manage', icon: 'user-check', label: 'ครูที่ปรึกษา', roles: ['admin'], isAdminOnly: true },
            { id: 'fees-manage', icon: 'coins', label: 'จัดการค่าเทอม', roles: ['admin'], isAdminOnly: true },
        ];

        function renderMenus() {
            const role = appState.user.role;
            const desktopNav = document.getElementById('desktopNavMenu');
            const mobileNav = document.getElementById('mobileNavMenu');
            const mobileAdminGrid = document.getElementById('mobileAdminGrid');
            
            desktopNav.innerHTML = ''; mobileNav.innerHTML = ''; mobileAdminGrid.innerHTML = '';

            const userMenus = menuConfig.filter(m => m.roles.includes(role));
            const adminExtraMenus = role === 'admin' ? menuConfig.filter(m => m.isAdminOnly) : [];
            const primaryMenus = userMenus.filter(m => !m.isAdminOnly);

            userMenus.forEach(menu => {
                desktopNav.innerHTML += `
                    <button onclick="navigate('${menu.id}')" id="nav-desktop-${menu.id}" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-primary transition font-medium">
                        <i data-lucide="${menu.icon}" class="w-5 h-5"></i> ${menu.label}
                    </button>
                `;
            });

            primaryMenus.forEach(menu => {
                mobileNav.innerHTML += `
                    <button onclick="navigate('${menu.id}')" id="nav-mobile-${menu.id}" class="flex flex-col items-center p-2 text-slate-500 hover:text-primary">
                        <i data-lucide="${menu.icon}" class="w-6 h-6 mb-1"></i>
                        <span class="text-[10px]">${menu.label}</span>
                    </button>
                `;
            });

            if (role === 'admin') {

                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 w-full h-80">
                        <canvas id="paymentChart"></canvas>
                    </div>
                </div>
            `;
            try {
                const [{ data: students }, { data: fees }, { data: payments }] = await Promise.all([
                    dbClient.from('students').select('id, room_type').limit(5000),
                    dbClient.from('fee_items').select('id, room_type').limit(100),
                    dbClient.from('payments').select('student_id').eq('is_paid', true).limit(10000)
                ]);

                const total = students ? students.length : 0;
                let fullyPaid = 0, partialPaid = 0, unpaid = 0;

                const normalFeeCount = fees ? fees.filter(f => f.room_type === 'ห้องเรียนปกติ' || !f.room_type).length : 0;
                const specialFeeCount = fees ? fees.filter(f => f.room_type === 'ห้องเรียนพิเศษ').length : 0;

                const payCounts = {};
                if (payments) {
                    payments.forEach(p => { payCounts[p.student_id] = (payCounts[p.student_id] || 0) + 1; });
                }

                if (students) {
                    students.forEach(stu => {
                        const targetFees = (stu.room_type === 'ห้องเรียนพิเศษ' || stu.room_type === 'พิเศษ') ? specialFeeCount : normalFeeCount;
                        const paidCount = payCounts[stu.id] || 0;
                        
                        if (targetFees === 0 || paidCount === 0) unpaid++;
                        else if (paidCount < targetFees) partialPaid++;
                        else fullyPaid++;
                    });
                }

                        <div class="bg-emerald-100 p-3 rounded-xl text-success hidden md:block"><i data-lucide="check-circle"></i></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">

                        <div class="bg-red-100 p-3 rounded-xl text-danger hidden md:block"><i data-lucide="alert-circle"></i></div>
                    </div>
                `;
                lucide.createIcons();

                const ctx = document.getElementById('paymentChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['ชำระครบแล้ว', 'จ่ายยังไม่ครบ', 'ยังไม่จ่าย'],
                        datasets: [{ 
                            data: [fullyPaid, partialPaid, unpaid],

        async function fetchDataForClass(classLevel) {
            const container = document.getElementById('roomContentContainer');
            container.innerHTML = `<div class="text-center p-8"><div class="loader mx-auto mb-3" style="border-top-color:#4f46e5;"></div><p class="text-primary text-lg">กำลังโหลดข้อมูลชั้น ${classLevel}...</p></div>`;
            document.getElementById('roomTabs').innerHTML = ''; 

            try {
                // เรียงลำดับตาม ห้อง -> เลขที่ -> รหัสประจำตัว
                const { data: students, error: err1 } = await dbClient.from('students')
                    .select('*').eq('class_level', classLevel).order('room').order('student_no', { ascending: true, nullsFirst: false }).order('username');
                
                const { data: teachers, error: err2 } = await dbClient.from('teachers')
                    .select('*').eq('class_level', classLevel).in('role', ['teacher', 'admin', 'director']).order('room').order('username');

                if (err1 || err2) throw new Error('โหลดข้อมูลล้มเหลว');
                
                manageState.classUsers = [...(students || []), ...(teachers || [])];

                const { data: fees } = await dbClient.from('fee_items').select('id, room_type');
                if (fees) {
                    manageState.feesNormal = fees.filter(f => f.room_type === 'ห้องเรียนปกติ' || !f.room_type).length;
                    manageState.feesSpecial = fees.filter(f => f.room_type === 'ห้องเรียนพิเศษ').length;
                } else {
                    manageState.feesNormal = 0; manageState.feesSpecial = 0;
                }

                const studentIds = (students || []).map(u => u.id);
                if (studentIds.length > 0) {
                    const { data: payments } = await dbClient.from('payments')
                        .select('student_id, fee_item_id')
                        .in('student_id', studentIds)
                        .eq('is_paid', true);
                    manageState.classPayments = payments || [];
                } else {
                    manageState.classPayments = [];
                }

                renderRoomFilterAndData();
            } catch (error) {

        }

        window.openUserModal = async (classLevel, userId = null, role = null) => {
            const modal = document.getElementById('userModal');
            const title = document.getElementById('modalUserTitle');
            const form = document.getElementById('userForm');
            const isStudent = manageState.currentRoleView === 'student';
            
            form.reset();
            document.getElementById('mu_id').value = '';
            document.getElementById('mu_class').value = classLevel;
            if (isStudent && document.getElementById('mu_student_no')) {
                document.getElementById('mu_student_no').value = '';
            }

            if (userId) {
                title.innerText = isStudent ? 'แก้ไขข้อมูลนักเรียน' : 'แก้ไขข้อมูลครูที่ปรึกษา';
                showLoader();
                const tableName = (role === 'student') ? 'students' : 'teachers';
                const { data, error } = await dbClient.from(tableName).select('*').eq('id', userId).single();
                hideLoader();
                
                if (data && !error) {
                    document.getElementById('mu_id').value = data.id;
                    document.getElementById('mu_username').value = data.username;
                    document.getElementById('mu_prefix').value = data.prefix || '';
                    document.getElementById('mu_firstname').value = data.firstname || '';
                    document.getElementById('mu_lastname').value = data.lastname || '';
                    
                    let editRoom = data.room || '';
                    if (editRoom.startsWith('/')) editRoom = editRoom.substring(1);
                    document.getElementById('mu_room').value = editRoom;
                    
                    if (isStudent) {
                        let rType = data.room_type || 'ห้องเรียนปกติ';
                        if (rType.includes('พิเศษ')) rType = 'ห้องเรียนพิเศษ';
                        else rType = 'ห้องเรียนปกติ';
                        document.getElementById('mu_roomtype').value = rType;
                        document.getElementById('mu_student_no').value = data.student_no || '';
                    }
                }
            } else {
                title.innerText = isStudent ? `เพิ่มข้อมูลนักเรียน (ชั้น ${classLevel})` : `เพิ่มข้อมูลครูที่ปรึกษา (ชั้น ${classLevel})`;
            }
            modal.classList.remove('hidden');
        };

        window.closeUserModal = () => document.getElementById('userModal').classList.add('hidden');

        window.saveUserData = async (e) => {
            e.preventDefault();
            showLoader();
            
            let inputRoom = document.getElementById('mu_room').value.trim();
            if (inputRoom && !inputRoom.startsWith('/')) {
                inputRoom = '/' + inputRoom;
            }

            const id = document.getElementById('mu_id').value;
            const isStudentView = manageState.currentRoleView === 'student';
            const tableName = isStudentView ? 'students' : 'teachers';

            const payload = {
                username: document.getElementById('mu_username').value.trim(),
                prefix: document.getElementById('mu_prefix').value,
                firstname: document.getElementById('mu_firstname').value.trim(),
                lastname: document.getElementById('mu_lastname').value.trim(),
                class_level: document.getElementById('mu_class').value,
                room: inputRoom
            };

            if (isStudentView) {
                payload.role = 'student';
                payload.room_type = document.getElementById('mu_roomtype').value;
                const stuNo = document.getElementById('mu_student_no').value;
                payload.student_no = stuNo ? parseInt(stuNo) : null;
            } else {
                payload.role = 'teacher';
            }

            try {
                if (id) {
                    await dbClient.from(tableName).update(payload).eq('id', id);
                    showToast('อัปเดตข้อมูลสำเร็จ');
                } else {
                    await dbClient.from(tableName).insert([payload]);
                    showToast('เพิ่มข้อมูลสำเร็จ');
                }
                closeUserModal();
                fetchDataForClass(manageState.currentClass); 
            } catch(error) {
                showToast('เกิดข้อผิดพลาด (รหัสอาจซ้ำกับในระบบ)', 'danger');
            }
            hideLoader();
        };

        window.deleteUser = async (id, role) => {
            Swal.fire({
                title: 'ยืนยันการลบข้อมูล?',
                text: "ประวัติการจ่ายเงินของบุคลากรรายนี้จะหายไปด้วย!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#475569',
                confirmButtonText: 'ใช่, ลบทิ้งเลย',
                cancelButtonText: 'ยกเลิก'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    showLoader();
                    try {
                        const tableName = (role === 'student') ? 'students' : 'teachers';
                        await dbClient.from(tableName).delete().eq('id', id);
                        showToast('ลบข้อมูลเรียบร้อยแล้ว', 'success');
                        fetchDataForClass(manageState.currentClass);
                    } catch(error) { showToast('ลบข้อมูลไม่สำเร็จ', 'danger'); }
                    hideLoader();
                }
            });
        };

        window.downloadSampleCSV = () => {
            const isStudent = manageState.currentRoleView === 'student';
            let headerRow, dataRow;
            if (isStudent) {
                headerRow = "username,prefix,firstname,lastname,class_level,room,room_type,student_no\n";
                dataRow = "67001,ด.ช.,สมชาย,เรียนดี,ม.1,1,ห้องเรียนปกติ,1\n";
            } else {
                headerRow = "username,prefix,firstname,lastname,class_level,room\n";
                dataRow = "1111111111111,นาย,สมศักดิ์,สอนดี,ม.1,1\n";
            }
            const csvContent = "\uFEFF" + headerRow + dataRow; 
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `ไฟล์ตัวอย่าง_${isStudent ? 'นักเรียน' : 'ครูที่ปรึกษา'}_${manageState.currentClass}.csv`;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.handleCSVUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            showLoader();
            const reader = new FileReader();
            
            reader.onload = async (event) => {
                try {
                    let csvText = event.target.result;
                    if (csvText.charCodeAt(0) === 0xFEFF) csvText = csvText.slice(1);
                    const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
                    if (lines.length < 2) { hideLoader(); showToast('ไฟล์ไม่มีข้อมูล', 'warning'); e.target.value = ''; return; }

                    const isStudent = manageState.currentRoleView === 'student';
                    const tableName = isStudent ? 'students' : 'teachers';
                    const rowsToInsert = [];
                    
                    for (let i = 1; i < lines.length; i++) {
                        const values = lines[i].split(',').map(v => v.trim());
                        if (values.length >= 4 && values[0] && values[2]) {
                            let csvRoom = values[5] ? values[5].trim() : '';
                            if (csvRoom && !csvRoom.startsWith('/')) csvRoom = '/' + csvRoom;
                            const payload = {
                                username: values[0],
                                prefix: values[1] || '',
                                firstname: values[2],
                                lastname: values[3],
                                class_level: values[4] || manageState.currentClass,
                                room: csvRoom
                            };
                            if (isStudent) {
                                payload.role = 'student';
                                let csvRoomType = values[6] ? values[6].trim() : 'ห้องเรียนปกติ';
                                if (csvRoomType.includes('พิเศษ')) csvRoomType = 'ห้องเรียนพิเศษ';
                                else csvRoomType = 'ห้องเรียนปกติ';
                                payload.room_type = csvRoomType;
                                
                                // รับค่าคอลัมน์ที่ 8 (index 7) เป็นเลขที่
                                payload.student_no = values[7] ? parseInt(values[7]) : null;
                            } else {
                                payload.role = 'teacher';
                            }
                            rowsToInsert.push(payload);
                        }
                    }

                    if (rowsToInsert.length === 0) { hideLoader(); showToast('ข้อมูลไม่สมบูรณ์', 'warning'); return; }
                    await dbClient.from(tableName).upsert(rowsToInsert, { onConflict: 'username' });
                    showToast(`นำเข้าสำเร็จ ${rowsToInsert.length} รายการ`, 'success');
                    fetchDataForClass(manageState.currentClass);
                } catch (err) { showToast('เกิดข้อผิดพลาดในการนำเข้า', 'danger'); }
                hideLoader();
                e.target.value = ''; 
            };
            reader.readAsText(file);
        };

        async function loadFeesData() {
            showLoader();
            try {
                const { data, error } = await dbClient.from('fee_items').select('*').order('created_at', { ascending: true });
                if (error) throw error;

                const normalFees = data.filter(f => f.room_type === 'ห้องเรียนปกติ' || !f.room_type);
                const specialFees = data.filter(f => f.room_type === 'ห้องเรียนพิเศษ');

                const renderTable = (fees, typeName, typeValue, colorClass, btnColorClass) => {
                    let total = 0;
                    let rows = fees.map(f => {
                        total += Number(f.amount);
                        return `<tr class="border-b border-slate-50 hover:bg-slate-50 transition group"><td class="p-3 text-slate-800">${f.title}</td><td class="p-3 text-right font-medium text-slate-600">${formatCurrency(f.amount)}</td><td class="p-3 text-right opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap w-24"><button onclick="openFeeModal('${typeValue}', '${f.id}', '${f.title}', ${f.amount})" class="text-amber-500 hover:bg-amber-50 p-2 rounded-lg transition mr-1"><i data-lucide="edit" class="w-4 h-4"></i></button><button onclick="deleteFeeItem('${f.id}')" class="text-danger hover:bg-red-50 p-2 rounded-lg transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`;
                    }).join('');

                    if(fees.length === 0) rows = `<tr><td colspan="3" class="p-6 text-center text-slate-400">ยังไม่มีรายการ</td></tr>`;

                    return `
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col h-full slide-up">
                            <div class="p-4 border-b border-slate-100 ${colorClass} flex justify-between items-center">

        window.printDailyReport = () => {
            const dateObj = new Date();
            const localY = dateObj.getFullYear();
            const localM = dateObj.getMonth();
            const localD = dateObj.getDate();
            
            const thaiMonths = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
            const thaiDateString = `${localD} ${thaiMonths[localM]} ${localY + 543}`;

                if(!p.paid_at) return false;
                const pDate = new Date(p.paid_at);
                return pDate.getFullYear() === localY && pDate.getMonth() === localM && pDate.getDate() === localD;
            });

        window.calculateModalTotal = () => {
            let total = 0;
            let allChecked = true;
            const checkboxes = document.querySelectorAll('.fee-checkbox');
            if(checkboxes.length === 0) allChecked = false;
            checkboxes.forEach(c => {
                if(c.checked) total += Number(c.dataset.amount);
                else allChecked = false;
            });
            document.getElementById('modalTotalSelected').innerText = formatCurrency(total);
            document.getElementById('checkAllFees').checked = allChecked;
        };

        window.saveStudentPayments = async () => {
            showLoader();
            const checkboxes = document.querySelectorAll('.fee-checkbox');
            const toInsert = [];
            const toDeleteIds = [];

            checkboxes.forEach(c => {
                const existing = modalState.payments.find(p => p.fee_item_id === c.value && p.is_paid);
                if(c.checked) {
                    if (!existing) {
                        toInsert.push({
                            student_id: modalState.studentId,
                            fee_item_id: c.value,
                            is_paid: true,
                            paid_at: new Date().toISOString(),
                            paid_by_teacher: appState.user.id
                        });
                    }
                } else {
                    if (existing) {
                        toDeleteIds.push(c.value);
                    }
                }
            });

            try {
                // ลบรายการที่ถูกติ๊กออก
                if(toDeleteIds.length > 0) {
                    await dbClient.from('payments').delete().eq('student_id', modalState.studentId).in('fee_item_id', toDeleteIds);
                }
                
                // เพิ่มรายการใหม่
                if(toInsert.length > 0) {
                    let nextNum = null;
                    
                    // 1. ลองใช้แบบ RPC (ป้องกันเลขซ้ำ)
                    const { data: rpcNum, error: rpcError } = await dbClient.rpc('get_next_receipt_no');
                    
                    if (!rpcError && rpcNum) {
                        nextNum = rpcNum;
                    } else {
                        // 2. แผนสำรอง (Fallback): ถ้า RPC พังหรือติด Error 400 ให้กลับมาใช้วิธีปกติ
                        console.warn("RPC Failed, using fallback method");
                        const { data: sSettings } = await dbClient.from('school_settings').select('id, current_receipt_no').limit(1).single();
                        if (sSettings) {
                            nextNum = (parseInt(sSettings.current_receipt_no) || 0) + 1;
                            // อัปเดตกลับลงฐานข้อมูล
                            await dbClient.from('school_settings').update({ current_receipt_no: nextNum }).eq('id', sSettings.id);
                        }
                    }

                    // ถ้ารันเลขสำเร็จ ให้นำเลขไปใส่ในใบเสร็จ
                    if (nextNum) {
                        let yearStr = appState.school?.academic_year || (new Date().getFullYear() + 543).toString();
                        let newReceiptNo = String(nextNum).padStart(4, '0') + '/' + yearStr;
                        
                        toInsert.forEach(p => p.receipt_no = newReceiptNo);
                        if(appState.school) appState.school.current_receipt_no = nextNum; 
                    }
                    
                    // บันทึกรายการจ่ายเงิน
                    await dbClient.from('payments').upsert(toInsert, { onConflict: 'student_id,fee_item_id' });
                }
                
                showToast('บันทึกข้อมูลสำเร็จ', 'success');
                document.getElementById('feeModal').remove();
                if(appState.currentPage === 'advisory') renderAdvisory(document.getElementById('contentArea'));

                showToast('เกิดข้อผิดพลาดในการบันทึก', 'danger');

                        <td style="border: 1px solid #000; padding: 6px; text-align: center;">${index + 1}</td>
                        <td style="border: 1px solid #000; padding: 6px;">${feeItem.title}</td>
                        <td style="border: 1px solid #000; padding: 6px; text-align: center;">${amountDisplay}</td>
                        <td style="border: 1px solid #000; padding: 6px; text-align: center;">${remarkDisplay}</td>
                    </tr>
                `;
            });

            const rNoStr = Array.from(receiptNos).join(', ') || '-';
            const dateStr = Array.from(payDates).join(', ') || '-';
            const thaiBahtText = ThaiBaht(totalAmount);

            const user = appState.user;
            const studentName = (user.prefix || '') + user.firstname + ' ' + user.lastname;
            let roomType = user.room_type || 'ห้องเรียนปกติ';
            if (roomType.includes('พิเศษ')) roomType = 'ห้องเรียนพิเศษ';
            else roomType = 'ห้องเรียนปกติ';
            let cleanRoom = user.room || '';
            if(cleanRoom.startsWith('/')) cleanRoom = cleanRoom.substring(1);

            const sName = appState.school?.school_name || 'โรงเรียนตัวอย่าง';
            const sAddress = appState.school?.school_address || '-';
            const term = appState.school?.term || '-';
            const year = appState.school?.academic_year || '-';
            const sLogo = appState.school?.school_logo || '';
            const sSig = appState.school?.finance_signature || '';

            const logoHtml = sLogo ? `<img src="${sLogo}" style="height: 70px; width: auto; object-fit: contain; display: block; margin: 0 auto;">` : '';
            const sigHtml = sSig ? `<img src="${sSig}" style="height: 40px; width: auto; object-fit: contain; display: block; margin: 0 auto 5px auto;">` : '<div style="height:40px;"></div>';

            const el = document.createElement('div');
            el.style.width = '720px';
            el.style.backgroundColor = '#ffffff';

            el.innerHTML = `
                <div style="font-family: 'Sarabun', sans-serif; padding: 20px 30px; color: #000; font-size: 15px; line-height: 1.4; box-sizing: border-box; width: 100%;">
                    <div style="text-align: center; color: #475569; font-weight: bold; margin-bottom: 5px; font-size: 16px;">สำเนาสำหรับนักเรียน</div>
                    
                    <div style="text-align: center; margin-bottom: 10px;">
                        ${logoHtml}
                    </div>
                    
                    <div style="text-align: center; margin-bottom: 15px;">
                        <h2 style="margin: 0; font-size: 20px; font-weight: bold;">ใบเสร็จชำระเงิน</h2>
                        <h3 style="margin: 3px 0 0; font-size: 18px; font-weight: normal;">${sName}</h3>
                        <p style="margin: 3px 0 0; font-size: 14px;">${sAddress}</p>
                    </div>
                    
                    <table style="width: 100%; border: none; border-collapse: collapse; margin-bottom: 15px; font-size: 15px;">
                        <tr>
                            <td style="padding: 2px 0; width: 65%;"><strong>เลขที่ใบเสร็จ:</strong> ${rNoStr}</td>
                            <td style="padding: 2px 0; width: 35%;"></td>
                        </tr>
                        <tr>
                            <td style="padding: 2px 0;"><strong>ประจำปีการศึกษา:</strong> ${year} &nbsp;&nbsp;&nbsp;&nbsp; <strong>ภาคเรียนที่:</strong> ${term}</td>
                            <td style="padding: 2px 0;"></td>
                        </tr>
                        <tr>
                            <td style="padding: 2px 0;"><strong>รหัสประจำตัว:</strong> ${user.username}</td>
                            <td style="padding: 2px 0;"></td>
                        </tr>
                        <tr>
                            <td style="padding: 2px 0;"><strong>ชื่อ-สกุล:</strong> ${studentName}</td>
                            <td style="padding: 2px 0;"></td>
                        </tr>
                        <tr>
                            <td style="padding: 2px 0;"><strong>ชั้น:</strong> ${user.class_level}/${cleanRoom} &nbsp;&nbsp;&nbsp;&nbsp; <strong>ประเภทห้อง:</strong> ${roomType}</td>
                            <td style="padding: 2px 0; text-align: right; font-weight: bold;">วันที่ชำระ: ${dateStr}</td>
                        </tr>
                    </table>

                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 14px;">
                        <thead>
                            <tr>
                                <th style="border: 1px solid #000; padding: 6px; text-align: center; width: 60px;">ลำดับ</th>
                                <th style="border: 1px solid #000; padding: 6px; text-align: center;">รายการ</th>
                                <th style="border: 1px solid #000; padding: 6px; text-align: center; width: 120px;">ราคา/หน่วย</th>
                                <th style="border: 1px solid #000; padding: 6px; text-align: center; width: 80px;">หมายเหตุ</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${receiptRows}
                        </tbody>
                        <tfoot>
                            <tr>
                                <td style="border: 1px solid #000; padding: 6px; text-align: center; font-weight: bold;">รวม</td>
                                <td style="border: 1px solid #000; padding: 6px; text-align: center; font-weight: bold;">${thaiBahtText}</td>
                                <td style="border: 1px solid #000; padding: 6px; text-align: center; font-weight: bold;">${formatCurrency(totalAmount)}</td>
                                <td style="border: 1px solid #000; padding: 6px; text-align: center; font-weight: bold;">บาท</td>
                            </tr>
                        </tfoot>
                    </table>
                    
                    <p style="margin-top: 10px; font-weight: bold; font-size: 15px;">ได้รับเงินไว้เป็นการถูกต้องแล้ว</p>
                    
                    <div style="text-align: center; margin-top: 30px; float: right; width: 250px;">
                        ${sigHtml}
                        <p style="margin: 2px 0; font-size: 15px;">( นางสาวชนกพร สุบินดี )</p>
                        <p style="margin: 2px 0; font-size: 14px;">เจ้าหน้าที่การเงิน</p>
                    </div>
                    <div style="clear: both;"></div>
                </div>
            `;
            
            const originalScroll = window.scrollY;
            window.scrollTo(0, 0);

            html2pdf().set({
                margin: 0.2, 
                filename: `Receipt_Copy_${user.username}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, scrollY: 0, scrollX: 0 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            }).from(el).save().then(() => {
                window.scrollTo(0, originalScroll);
            });
        };

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
